# Bake-off runtime config. Tool config lives in pyproject.toml.
base_config: configs/base.yaml
results_dir: results/bakeoff        # run jsons -> <results_dir>/runs, summary.json
oof_dir: results/oof
outputs_dir: outputs/runs           # npz with per-epoch probs (not committed)

# "auto" => read the recommended max_len from results/eda.json
max_len: auto
epochs: 20
batch_size: 16
warmup_ratio: 0.1
weight_decay: 0.01
lr_grid: [2.0e-5, 3.0e-5, 5.0e-5]
fold_seed_idx: [0, 1, 2]     # cv_fold_s0..s2
model_seeds: [0, 1, 2]
n_folds: 5

models:
  # expected_run_s: duration hint per fold-run (PLACEHOLDER until --stage timing runs)
  intfloat/multilingual-e5-base:
    precision: fp16
    expected_run_s: 600
  FacebookAI/xlm-roberta-base:
    precision: fp16
    expected_run_s: 600
  microsoft/mdeberta-v3-base:
    precision: fp16   # switch to bf16 if smoke test shows NaN (see report)
    expected_run_s: 900

wandb:
  project: intent-router
  group_bakeoff: bakeoff
  group_ablations: ablations

# Winner-only ablations: flags merged into the train config.
ablations:
  class_weight: {class_weighted: true}
  label_smoothing: {label_smoothing: 0.1}
  lld: {layer_decay: 0.9}
  entity_mask: {entity_masking: true}
  hier_aux: {hier_aux: true, hier_lambda: 0.5}

ablate:
  fold_seed_idx: [0, 1, 2]
  # Fixed before the runs: model seed 0 only (15 fold-runs per ablation), compared paired
  # against the winner's ms0 confirm runs; the noise band comes from the winner's 3 model seeds.
  model_seeds: [0]

baselines:
  c_grid: [0.1, 0.3, 1, 3, 10, 30, 100]
  inner_folds: 5
  e5_model: intfloat/multilingual-e5-base
  fold_seed_idx: [0, 1, 2]

# selection-robustness check post-hoc selection-robustness check (pre-registered 2026-10-02).
selection_check:
  models: [FacebookAI/xlm-roberta-base, microsoft/mdeberta-v3-base]
  lrs: [5.0e-5, 7.0e-5, 1.0e-4]
  epochs: 30                  # linear schedule over 30 epochs, warmup_ratio as above
  fold_seed_idx: [0]
  model_seeds: [0]
  confirm:                    # --stage selcheck_confirm --models <m> --lrs <lr>
    fold_seed_idx: [0, 1, 2]
    model_seeds: [0, 1, 2]
  results_dir: results/selection_check   # run jsons -> <results_dir>/runs
  outputs_dir: outputs/selection_check/runs
  wandb_group: selection-check

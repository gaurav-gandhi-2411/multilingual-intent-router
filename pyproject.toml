[project]
name = "intent-router"
version = "0.1.0"
description = "Multilingual intent classifier with open-set abstention"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Generated by scripts/build_colab_notebook.py; a test pins it to the generator output.
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Generated notebook (scripts/build_colab_notebook.py): long markdown/code lines are intentional.
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
